<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кубики Хогвартса</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent !important; }
  body { font-family: 'Cinzel', 'Palatino Linotype', Georgia, serif; color: #f3e3b3; }
  .wrap { max-width: 580px; margin: 0 auto; padding: 12px; box-sizing: border-box; }

  .panel {
    background: rgba(24, 16, 38, .88);
    border: 2px solid #b8923c; border-radius: 14px;
    padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 18px;
    align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,220,130,.15);
  }
  .group { display: flex; gap: 6px; align-items: center; }
  .group > span { font-size: 13px; opacity: .85; margin-right: 2px; }
  .panel button {
    font: 700 15px 'Cinzel', Georgia, serif; color: #f3e3b3; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1.5px solid #8a6d2e; border-radius: 8px;
    min-width: 38px; padding: 6px 9px; transition: background .15s, transform .1s;
  }
  .panel button:hover { background: rgba(255,220,130,.18); }
  .panel button:active { transform: scale(.95); }
  .panel button:focus-visible { outline: 2px solid #ffd978; outline-offset: 2px; }
  .panel button.on { background: #b8923c; color: #1a1020; border-color: #f0c14b; }
  #roll {
    padding: 8px 22px; font-size: 16px; color: #1a1020;
    background: linear-gradient(#f0c14b, #b8923c); border-color: #f6dd96;
  }
  #roll:hover { background: linear-gradient(#f8d56e, #c9a04a); }

  .tray {
    position: relative; height: 250px; margin-top: 12px; overflow: hidden;
    border: 12px solid #3b2414; border-radius: 22px;
    border-image: none;
    background: radial-gradient(ellipse at 50% 40%, #1f4a33, #0f2619 75%);
    box-shadow: 0 0 0 2px #6b4425, 0 10px 24px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.65);
  }
  .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 20px; font-size: 15px; color: rgba(243,227,179,.6);
  }
  .die {
    position: absolute; will-change: transform;
    filter: drop-shadow(0 6px 5px rgba(0,0,0,.55));
  }
  .die svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .o { fill: var(--c1); stroke: var(--a); stroke-width: 2.5; stroke-linejoin: round; }
  .f { fill: rgba(0,0,0,.24); }
  .l { stroke: var(--a); stroke-opacity: .6; stroke-width: 1.4; fill: none; stroke-linejoin: round; }
  .t {
    font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 25px;
    text-anchor: middle; dominant-baseline: central; fill: var(--a);
    paint-order: stroke; stroke: rgba(0,0,0,.5); stroke-width: 3px; stroke-linejoin: round;
  }

  .result {
    margin-top: 12px; min-height: 40px; display: flex; flex-wrap: wrap; gap: 6px 8px;
    align-items: center; justify-content: center;
  }
  .sum {
    font-weight: 700; font-size: 18px; padding: 5px 14px; border-radius: 999px;
    background: rgba(24,16,38,.88); border: 1.5px solid #b8923c;
  }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--a);
    background: var(--c2); color: var(--a);
  }
  @media (prefers-reduced-motion: reduce) { .panel button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="group" id="types"><span>Кубик</span>
      <button data-v="10">д10</button><button data-v="12">д12</button><button data-v="20" class="on">д20</button>
    </div>
    <div class="group" id="counts"><span>Сколько</span>
      <button data-v="1">1</button><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="4">4</button><button data-v="5">5</button>
    </div>
    <button id="roll">Бросить</button>
  </div>

  <div class="tray" id="tray"><div class="hint">Выбери кубик и количество, затем брось их в лоток</div></div>
  <div class="result" id="result"></div>
</div>

<script>
const FACULTIES = [
  { n: 'Гриффиндор', c1: '#a8201f', c2: '#5e0b0d', a: '#f2c94c' },
  { n: 'Слизерин',   c1: '#2c7d4f', c2: '#0f3d22', a: '#dfe5e2' },
  { n: 'Когтевран',  c1: '#2f52a6', c2: '#101c4a', a: '#d9a864' },
  { n: 'Пуффендуй',  c1: '#f1c232', c2: '#8a6508', a: '#2b2214' }
];

let type = 20, count = 3, busy = false;
const tray = document.getElementById('tray');
const result = document.getElementById('result');
const rnd = (a, b) => a + Math.random() * (b - a);

function dieSVG(sides) {
  let body, ty = 50;
  if (sides === 20) {
    body = '<polygon class="o" points="50,3 91,26 91,74 50,97 9,74 9,26"/>' +
           '<polygon class="f" points="50,24 79,72 21,72"/>' +
           '<path class="l" d="M50 24L50 3M50 24L9 26M50 24L91 26M79 72L91 74M79 72L91 26M79 72L50 97M21 72L9 74M21 72L9 26M21 72L50 97"/>';
    ty = 57;
  } else if (sides === 12) {
    const P = (r, k, n, off) => {
      const a = (-90 + off + k * 360 / n) * Math.PI / 180;
      return [50 + r * Math.cos(a), 50 + r * Math.sin(a)];
    };
    const out = [...Array(10)].map((_, k) => P(47, k, 10, 0));
    const inn = [...Array(5)].map((_, k) => P(27, k, 5, 0));
    const fmt = p => p.map(v => v.toFixed(1)).join(',');
    const lines = inn.map((p, k) => `M${fmt(p)}L${fmt(out[2 * k])}`).join('');
    body = `<polygon class="o" points="${out.map(fmt).join(' ')}"/>` +
           `<polygon class="f" points="${inn.map(fmt).join(' ')}"/>` +
           `<path class="l" d="${lines}"/>`;
    ty = 52;
  } else {
    body = '<polygon class="o" points="50,3 93,40 50,97 7,40"/>' +
           '<polygon class="f" points="7,40 50,58 93,40 50,97"/>' +
           '<path class="l" d="M7 40L50 58L93 40M50 58L50 97"/>';
    ty = 36;
  }
  return `<svg viewBox="0 0 100 100">${body}` +
    '<ellipse cx="38" cy="22" rx="20" ry="9" fill="#fff" opacity=".13" transform="rotate(-25 38 22)"/>' +
    `<text class="t" x="50" y="${ty}">?</text></svg>`;
}

function roll() {
  if (busy) return;
  busy = true;
  tray.innerHTML = '';
  result.innerHTML = '';
  const W = tray.clientWidth, H = tray.clientHeight;
  const size = Math.min(96, (W / count) * 0.86, H * 0.62);
  const slot = W / count;
  const rolls = [];
  let longest = 0;

  for (let i = 0; i < count; i++) {
    const f = FACULTIES[Math.floor(Math.random() * FACULTIES.length)];
    const value = 1 + Math.floor(Math.random() * type);
    const el = document.createElement('div');
    el.className = 'die';
    el.title = f.n;
    el.style.cssText = `--c1:${f.c1};--c2:${f.c2};--a:${f.a};width:${size}px;height:${size}px;` +
      `left:${slot * (i + .5) - size / 2 + rnd(-slot * .06, slot * .06)}px;` +
      `top:${H / 2 - size / 2 + rnd(-H * .12, H * .12)}px`;
    el.innerHTML = dieSVG(type);
    tray.appendChild(el);

    const label = el.querySelector('.t');
    const dur = 950 + i * 140;
    longest = Math.max(longest, dur);
    const r1 = rnd(-28, 28), r0 = rnd(-900, -480) * (Math.random() < .5 ? 1 : -1);
    const dx = rnd(-70, 70);
    el.animate([
      { transform: `translate(${dx}px,${-H}px) rotate(${r0}deg) scale(1.25)`, opacity: 0 },
      { transform: `translate(0,0) rotate(${r1}deg) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(${dx * .15}px,-16px) rotate(${r1 + 9}deg)`, offset: .75 },
      { transform: `translate(0,0) rotate(${r1}deg)`, offset: .9 },
      { transform: `translate(0,0) rotate(${r1}deg)` }
    ], { duration: dur, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });

    const tick = setInterval(() => { label.textContent = 1 + Math.floor(Math.random() * type); }, 70);
    setTimeout(() => { clearInterval(tick); label.textContent = value; }, dur * .8);
    rolls.push({ f, value });
  }

  setTimeout(() => {
    const sum = rolls.reduce((s, r) => s + r.value, 0);
    result.innerHTML = (count > 1 ? `<span class="sum">Сумма: ${sum}</span>` : `<span class="sum">Выпало: ${sum}</span>`) +
      rolls.map(r => `<span class="chip" style="--a:${r.f.a};--c2:${r.f.c2}">${r.f.n}: ${r.value}</span>`).join('');
    busy = false;
  }, longest + 80);
}

function bindGroup(id, set) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    e.currentTarget.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    set(+b.dataset.v);
  });
}
bindGroup('types', v => type = v);
bindGroup('counts', v => count = v);
document.getElementById('roll').addEventListener('click', roll);
</script>
</body>
</html>
